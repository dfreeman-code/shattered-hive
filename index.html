h3><p>✦ Where is Queen Aurelia, and why did she enter the fungal network?</p><p>✦ Who is spreading the spores beneath Dewdrop Hollow?</p><p>✦ Can the Accord of the Six Wings survive the growing faction tensions?</p><p class="muted">Manage these as quests, events, or DM notes to reflect the players’ decisions.</p></div>`}function listpage(k){let data=db[k].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(query.toLowerCase())));let title=sections[k].replace(/^[^ ]+ /,'');let blocks=data.map(x=>{let title=x.name||x.from+' → '+x.to;let props=k==='pcs'?[x.species,x.class,x.level&&'Level '+x.level,x.status]:k==='npcs'?[x.species,x.role,x.status,x.relationship]:k==='factions'?['Reputation: '+x.reputation,x.leader]:k==='locations'?[x.region,x.type,x.discovered]:k==='quests'?[x.type,x.status,'Level '+x.level]:k==='sessions'?[x.status,x.date,x.location]:k==='events'?[x.type,x.date,x.location]:k==='encounters'?[x.status,x.level,x.location]:k==='notes'?[x.category]:[x.type];let body=x.objective||x.description||x.notes||x.summary||x.content||x.goal||x.details||'';let musicType={npcs:'NPC',factions:'Faction',locations:'Location',quests:'Quest',sessions:'Session',encounters:'Encounter'}[k];return `<article class="card"><div class="headrow"><h3 style="margin:0">${esc(title)}</h3></div><div style="margin:9px 0">${props.filter(v=>v!==undefined&&v!==null&&v!=='').map(badge).join('')}</div><p class="muted preview">${esc(String(body).slice(0,230))}${String(body).length>230?'…':''}</p>${musicType?musicLinks(musicType,x.name):''}<div class="cardfoot"><button class="btn small" onclick="edit('${k}','${x.id}')">View / Edit</button><button class="btn small danger" onclick="del('${k}','${x.id}')">Delete</button></div></article>`}).join('');return `<div class="headrow"><div><h2>${esc(title)}</h2><p class="muted">${db[k].length} records · Click View / Edit to see complete information.</p></div><div class="actions"><button class="btn" onclick="add('${k}')">+ Add ${singular[k]}</button>${k==='pcs'?`<button class="btn secondary" onclick="document.getElementById('heroImporter').click()">⇩ Import Bug Hero</button>`:''}</div></div>${k==='pcs'?`<div class="banner section"><b>New:</b> Import a spoiler-free hero file created in Bug Hero Creator. Species, story and gear preferences are preserved. Confirm your D&D class, stats, equipment, and HP separately.</div>`:''}<div class="toolbar"><input class="search" id="search" type="search" value="${esc(query)}" placeholder="Search ${esc(title.toLowerCase())}…" oninput="searchUpdate(this.value)"><button class="btn secondary" onclick="goto('${k}')">Clear search</button></div>${data.length?`<div class="grid">${blocks}</div>`:'<div class="empty">No matching records. Add a new one or try another search.</div>'}`}function searchUpdate(s){query=s;let el=document.activeElement;let start=el.selectionStart;render();let n=document.getElementById('search');if(n){n.focus();try{n.setSelectionRange(start,start)}catch(e){}}}function settings(){return `<h2>Campaign settings & data</h2><div class="two section">${card('Campaign profile',`<p><b>${esc(db.campaign.name)}</b></p><p>${esc(db.campaign.description)}</p><p><b>In-game:</b> ${esc(db.campaign.date)}<br><b>Location:</b> ${esc(db.campaign.location)}</p>`,`<button class="btn small" onclick="editCampaign()">Edit campaign</button>`)}${card('Backup and restore',`<p>All changes are saved automatically in this browser using local storage. Export a JSON backup regularly and import it to another browser or device. This app does not synchronize between devices.</p>`,`<button class="btn small" onclick="exportData()">Export JSON</button><button class="btn small secondary" onclick="document.getElementById('importer').click()">Import JSON</button>`)}${card('DM-only secrets',`<p class="preview">${esc(db.campaign.dmNotes)}</p><p class="muted">This application has no accounts or DM/player access controls. Do not share your live DM view with players if you need to protect spoilers.</p>`)}${card('Reset the campaign',`<p>Return every section to the original Shattered Hive starter data. This permanently replaces your current browser data unless backed up.</p>`,`<button class="btn small danger" onclick="resetData()">Reset all data</button>`)}</div>`}

function proficiency(level){return 2+Math.floor((Math.max(1,level)-1)/4)}
function progression(pc){return db.progression?.[pc.id]||{completed:[]}}
function progressToggle(id,i,checked){db.progression ||= {};let obj=db.progression[id]||{completed:[]};obj.completed=checked?[...new Set([...obj.completed,i])]:obj.completed.filter(n=>n!==i);db.progression[id]=obj;save();render()}
function levelChange(id,val){const pc=db.pcs.find(x=>x.id===id);if(!pc)return;let level=Number(val);if(!Number.isInteger(level)||level<1||level>20)return alert('Enter a level between 1 and 20. The guide covers levels 1–12.'); if(level===Number(pc.level))return; if(!confirm('Set '+pc.name+' to level '+level+'? Review hit points, spells, feats and abilities manually; these will not be automatically recalculated.'))return;pc.level=level;db.progression ||= {};db.progression[id]={completed:[]};save();render();toast('Level updated — follow the checklist')}
function levelDetail(pc){let cls=GUIDE[pc.class]||null,lvl=Math.min(20,Math.max(1,Number(pc.level)||1)),p=progression(pc);return `<section class="card section"><div class="headrow"><div><h3 style="margin:0">${esc(pc.name)} · Level ${lvl}</h3><p class="muted">${esc(pc.species||'Unknown species')} ${esc(pc.class||'No class')} ${pc.subclass?' · '+esc(pc.subclass):''}</p></div><div class="actions"><button class="btn small secondary" onclick="edit('pcs','${pc.id}')">Edit character</button><button class="btn small" onclick="levelChange('${pc.id}',${lvl+1})" ${lvl>=20?'disabled':''}>Award next level</button></div></div><p><b>Proficiency bonus:</b> +${proficiency(lvl)} &nbsp; <b>Hit Die:</b> ${cls?'d'+cls.die:'Check class'} &nbsp; <b>Max HP:</b> ${esc(pc.maxHp||pc.hp||'Not entered')}</p>${!cls?'<p class="banner">Class not recognized. Edit the PC to use a standard 2024 class for advancement suggestions.</p>':`<p><b>This level:</b> ${esc(cls.levels[lvl]||'Refer to the handbook class table.')}</p><p><b>Next level:</b> ${esc(cls.levels[lvl+1]||'Refer to handbook for levels beyond this guide.')}</p><p class="meta">2024 Player’s Handbook, ${esc(pc.class)} class, page ${cls.page}. This is a summary; refer to the full table for complete features and resources.</p>`}<div class="field"><label>Change character level (1–20)</label><div class="actions"><input aria-label="Level for ${esc(pc.name)}" id="lvl-${pc.id}" type="number" min="1" max="20" value="${lvl}" style="width:95px"><button class="btn secondary small" onclick="levelChange('${pc.id}',document.getElementById('lvl-${pc.id}').value)">Set level</button></div></div><h3>Level-up checklist</h3>${CHECKS.map((text,i)=>`<label class="levelcheck"><input type="checkbox" ${p.completed.includes(i)?'checked':''} onchange="progressToggle('${pc.id}',${i},this.checked)"> <span>${esc(text)}</span></label>`).join('')}<p class="meta">Progress saved per character for the current level. Awarding/changing a level resets this checklist.</p></section>`}
function levelingPage(){let candidates=db.pcs.map(pc=>`<option value="${esc(pc.id)}" ${selectedLevelPC===pc.id?'selected':''}>${esc(pc.name)} — Lv ${esc(pc.level||1)}</option>`).join('');let pc=db.pcs.find(x=>x.id===selectedLevelPC)||db.pcs[0];let speciesRows=Object.entries(SPECIES).map(([s,v])=>`<div class="item"><b>${esc(s)}</b> <span class="pill">${esc(v[0])}</span><p class="muted">${esc(v[2])}. Recommended subclass: ${esc(v[1])}.</p></div>`).join('');return `<div class="headrow"><div><h2>✦ Character Leveling</h2><p class="muted">2024 D&D 5e progression · Official classes with Shattered Hive homebrew bug species</p></div><button class="btn" onclick="add('pcs')">+ Add Player Character</button></div><div class="banner section"><b>How advancement works:</b> Species provides natural traits; your class determines features gained each level. Use shared story milestones. This planner does not automatically calculate HP, choose feats, or grant spell slots, to avoid applying incorrect character rules.</div><div class="two section"><div class="card"><h3>Select a player character</h3>${db.pcs.length?`<label for="levelPC">Character</label><select id="levelPC" onchange="selectedLevelPC=this.value;render()">${candidates}</select>`:'<p>No player characters yet. Add one to start tracking levels.</p>'}<p class="muted">Characters and progression checklists are saved with campaign backups.</p></div><div class="card"><h3>Advancement milestones</h3><p>Level 2: investigate missing crickets · Level 3: finish Old Root Tunnel · Level 5: survive political conflict · Level 7: venture beyond the flowerbed · Level 9: recover the Heartseed · Level 12: prepare for Mycora.</p><p><b>Proficiency:</b> +2 (levels 1–4), +3 (5–8), +4 (9–12).</p></div></div>${pc?levelDetail(pc):''}<div class="two section"><div class="card"><h3>Bug species and recommended classes</h3>${speciesRows}<p class="meta">Bug species abilities are original homebrew, not part of the official handbook. Other class combinations are welcome.</p></div><div class="card"><h3>2024 Player’s Handbook page references</h3><p>Character creation: p. 32 · Level advancement: p. 41 · Classes start: p. 49.</p>${CLASSNAMES.map(c=>`<div class="item"><b>${esc(c)}</b><span style="float:right">p. ${GUIDE[c].page}</span></div>`).join('')}<p><a href="https://www.dndbeyond.com/sources/dnd/phb-2024" target="_blank" rel="noopener noreferrer">Official 2024 Player’s Handbook on D&D Beyond ↗</a></p><p class="meta">Some handbook content requires access. 2014 page numbers and class progressions differ. Check the official class table for full details and spell slots.</p></div></div>`}

function defaultSheet(pc){return {scores:{STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10},saves:[],skills:[],expertise:[],inspiration:false,initiativeBonus:0,speed:30,tempHp:0,currentHp:pc.hp??10,maxHp:pc.maxHp??pc.hp??10,ac:pc.ac??10,deathSuccess:0,deathFailure:0,hitDiceUsed:0,spellAbility:'',spellSlots:{},spellPrepared:'',attacks:'',inventory:'',features:'',speciesNotes:'',conditions:'',languages:'Garden Tongue',proficiencies:'',passiveBonus:0,notes:'',characterPortrait:''}}
function getSheet(pc){db.sheets ||= {};return db.sheets[pc.id] ||= defaultSheet(pc)}
function scoreInput(attr,sh){let score=Number(sh.scores?.[attr]??10);return `<div class="statbox"><label>${attr}</label><input type="number" min="1" max="30" value="${score}" onchange="sheetSet('score','${attr}',this.value)"><strong>${signed(modifier(score))}</strong><label class="tiny"><input type="checkbox" ${sh.saves?.includes(attr)?'checked':''} onchange="sheetSet('save','${attr}',this.checked)"> Save ${signed(modifier(score)+(sh.saves?.includes(attr)?proficiency(currentSheetPC().level||1):0))}</label></div>`}
function currentSheetPC(){return db.pcs.find(p=>p.id===selectedSheetPC)||db.pcs[0]}
function sheetSet(kind,key,val){let pc=currentSheetPC();if(!pc)return;let sh=getSheet(pc);if(kind==='score'){sh.scores[key]=Math.max(1,Math.min(30,Number(val)||10));if(key==='CON')pc.constitution=modifier(sh.scores[key]);}else if(kind==='save'||kind==='skill'||kind==='expertise'){let field=kind==='save'?'saves':kind==='skill'?'skills':'expertise';sh[field] ||= [];sh[field]=val?[...new Set([...sh[field],key])]:sh[field].filter(x=>x!==key);if(kind==='expertise'&&val)sh.skills=[...new Set([...(sh.skills||[]),key])]}else if(kind==='slot'){sh.spellSlots[key]=Math.max(0,Number(val)||0)}else if(kind==='pc'){pc[key]=['ac','hp','maxHp'].includes(key)?Number(val):val; if(key==='maxHp')sh.maxHp=Number(val);if(key==='hp')sh.currentHp=Number(val);if(key==='ac')sh.ac=Number(val);}else if(['deathSuccess','deathFailure','hitDiceUsed','initiativeBonus','speed','tempHp','currentHp','maxHp','ac','passiveBonus'].includes(key)){sh[key]=Number(val)||0;if(key==='currentHp')pc.hp=sh[key];if(key==='maxHp')pc.maxHp=sh[key];if(key==='ac')pc.ac=sh[key]}else sh[key]=val;save();render()}
function sheetPage(){const pc=currentSheetPC();let options=db.pcs.map(x=>`<option value="${esc(x.id)}" ${pc?.id===x.id?'selected':''}>${esc(x.name)} — Level ${esc(x.level||1)}</option>`).join('');if(!pc)return `<div class="headrow"><h2>📜 Character Sheets</h2><button class="btn" onclick="add('pcs')">+ Add Character</button></div><div class="empty">Create a player character first, then return to complete their sheet.</div>`;let sh=getSheet(pc),prof=proficiency(Number(pc.level)||1),dex=modifier(sh.scores.DEX),spellMod=modifier(sh.scores[sh.spellAbility]||10);let species=BUG_TRAITS[pc.species]||[];return `<div class="headrow"><div><h2>📜 Character Sheets</h2><p class="muted">Editable D&D 5e 2024 player sheets · Saved with campaign backups</p></div><div class="actions"><button class="btn secondary" onclick="window.print()">Print sheet</button><button class="btn" onclick="edit('pcs','${pc.id}')">Edit PC profile</button></div></div><div class="card section"><label>Select player character</label><select onchange="selectedSheetPC=this.value;render()">${options}</select><h2>${esc(pc.name)}</h2><p class="muted">${esc(pc.species||'Species unset')} · ${esc(pc.class||'Class unset')} · Level ${esc(pc.level||1)} · ${esc(pc.subclass||'Subclass not selected')} · ${esc(pc.background||'Background unset')}</p><div class="sheetmetrics"><div><b>${signed(prof)}</b><small>Proficiency</small></div><div><b>${signed(dex+Number(sh.initiativeBonus||0))}</b><small>Initiative</small></div><div><b>${10+modifier(sh.scores.WIS)+ (sh.skills.includes('Perception')?prof:0)+(sh.expertise.includes('Perception')?prof:0)+Number(sh.passiveBonus||0)}</b><small>Passive Perception</small></div></div></div>
<div class="card section"><h3>Ability scores & saving throws</h3><div class="statgrid">${ATTRS.map(a=>scoreInput(a,sh)).join('')}</div><p class="meta">Saving throw proficiency must be selected from your class. Modifiers recalculate from scores and proficiency bonus.</p></div>
<div class="two section"><div class="card"><h3>Combat & resources</h3><div class="sheetfields">${[['ac','Armor Class'],['speed','Speed (game feet)'],['currentHp','Current HP'],['maxHp','Maximum HP'],['tempHp','Temporary HP'],['initiativeBonus','Additional initiative modifier'],['hitDiceUsed','Hit Dice spent']].map(([k,t])=>`<label>${t}<input type="number" value="${esc(sh[k])}" onchange="sheetSet('field','${k}',this.value)"></label>`).join('')}</div><div class="sheetfields"><label>Death save successes <input type="number" min="0" max="3" value="${sh.deathSuccess}" onchange="sheetSet('field','deathSuccess',this.value)"></label><label>Death save failures <input type="number" min="0" max="3" value="${sh.deathFailure}" onchange="sheetSet('field','deathFailure',this.value)"></label><label><input type="checkbox" ${sh.inspiration?'checked':''} onchange="sheetSet('field','inspiration',this.checked)"> Heroic Inspiration</label></div><p class="meta">Hit Dice total: ${esc(pc.level||1)}d${esc(GUIDE[pc.class]?.die||'?')}; hit points are manually assigned, not automatically rolled.</p></div><div class="card"><h3>Skill proficiencies</h3><div class="skillsgrid">${SKILLS.map(([name,attr])=>{let val=modifier(sh.scores[attr])+ (sh.skills.includes(name)?prof:0)+(sh.expertise.includes(name)?prof:0);return `<div class="skillrow"><label><input type="checkbox" ${sh.skills.includes(name)?'checked':''} onchange="sheetSet('skill','${name}',this.checked)"> ${name} <small>(${attr})</small></label><strong>${signed(val)}</strong><label title="Expertise"><input type="checkbox" ${sh.expertise.includes(name)?'checked':''} onchange="sheetSet('expertise','${name}',this.checked)"> Exp</label></div>`}).join('')}</div><p class="meta">Exp = expertise (double proficiency bonus). Select only when granted by your class or another feature.</p></div></div>
<div class="two section"><div class="card"><h3>Spellcasting</h3><label>Spellcasting ability <select onchange="sheetSet('field','spellAbility',this.value)"><option value="">None / select</option>${ATTRS.map(a=>`<option value="${a}" ${sh.spellAbility===a?'selected':''}>${a}</option>`).join('')}</select></label><p><b>Spell attack:</b> ${sh.spellAbility?signed(prof+spellMod):'—'} · <b>Spell save DC:</b> ${sh.spellAbility?8+prof+spellMod:'—'}</p><p class="meta">Enter remaining spell slots manually; slots vary by class, level and multiclass features.</p><div class="slotgrid">${Array.from({length:9},(_,i)=>`<label>Level ${i+1}<input type="number" min="0" value="${esc(sh.spellSlots[i+1]??0)}" onchange="sheetSet('slot','${i+1}',this.value)"></label>`).join('')}</div><label>Cantrips, prepared spells & spell notes<textarea onchange="sheetSet('field','spellPrepared',this.value)">${esc(sh.spellPrepared)}</textarea></label></div><div class="card"><h3>Bug species features</h3>${species.length?species.map(t=>`<div class="item">✿ ${esc(t)}</div>`).join(''):'<p class="muted">Enter a supported Shattered Hive bug species to display its traits.</p>'}<p class="meta">These species traits are homebrew, not official PHB species features. Confirm with your DM.</p><label>Species feature uses / special notes<textarea onchange="sheetSet('field','speciesNotes',this.value)">${esc(sh.speciesNotes)}</textarea></label><h3>Class features, feats, and resources</h3><textarea onchange="sheetSet('field','features',this.value)">${esc(sh.features)}</textarea><p class="meta">See 2024 Player’s Handbook ${esc(pc.class||'class')} p. ${esc(GUIDE[pc.class]?.page||'—')} for official advancement.</p></div></div>
<div class="two section"><div class="card"><h3>Attacks & weapons</h3><textarea onchange="sheetSet('field','attacks',this.value)" placeholder="Thorn sword: +5 to hit, 1d8+3 piercing…">${esc(sh.attacks)}</textarea><h3>Inventory & treasure</h3><textarea onchange="sheetSet('field','inventory',this.value)" placeholder="Acorn shield, dewdrop tokens, potions…">${esc(sh.inventory)}</textarea></div><div class="card"><h3>Other proficiencies & languages</h3><label>Languages <input value="${esc(sh.languages)}" onchange="sheetSet('field','languages',this.value)"></label><label>Tools, armor and weapon proficiencies<textarea onchange="sheetSet('field','proficiencies',this.value)">${esc(sh.proficiencies)}</textarea></label><label>Conditions<textarea onchange="sheetSet('field','conditions',this.value)">${esc(sh.conditions)}</textarea></label><label>Character notes<textarea onchange="sheetSet('field','notes',this.value)">${esc(sh.notes)}</textarea></label></div></div><div class="banner section">Leveling is managed in <button class="link" onclick="goto('leveling')">✦ Leveling Guide</button>. Values that depend on class decisions, spell choices, equipped items, and optional rules remain editable rather than guessed. Save a backup regularly.</div>`}


// Combat tracker v4: stored within the existing campaign JSON backup.
function combatState(){if(!db.combat||!Array.isArray(db.combat.participants))db.combat={name:'New Encounter',round:1,turn:0,active:false,participants:[],history:[]};if(!Array.isArray(db.combat.history))db.combat.history=[];return db.combat}
const combatConditions=['Blinded','Charmed','Deafened','Exhaustion','Frightened','Grappled','Incapacitated','Invisible','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious'];
const combatPreset={spore:{name:'Spore Worker',hp:7,ac:12,init:1,kind:'Enemy'},moldric:{name:'Maestro Moldric',hp:28,ac:13,init:2,kind:'Enemy'},strider:{name:'Water Strider',hp:9,ac:12,init:2,kind:'Enemy'}};
function combatLog(message){let c=combatState();c.history.unshift({id:uid(),time:new Date().toLocaleString(),round:c.round,text:message});c.history=c.history.slice(0,250)}
function combatAddPC(id){let pc=db.pcs.find(x=>x.id===id);if(!pc)return;let sh=pc.sheet||{},hp=Number(sh.maxHp??pc.maxHp??pc.hp??10),current=Number(sh.currentHp??pc.hp??hp);combatState().participants.push({id:uid(),pcId:pc.id,name:pc.name,kind:'PC',init:0,hp:current,maxHp:hp,ac:Number(sh.ac??pc.ac??10),conditions:[],notes:''});combatLog('Added '+pc.name);save();render()}
function combatAddPreset(key){let p=combatPreset[key];if(!p)return;combatState().participants.push({...p,id:uid(),maxHp:p.hp,conditions:[],notes:''});combatLog('Added '+p.name);save();render()}
function combatAddCustom(){let n=prompt('Combatant name');if(!n||!n.trim())return;let hp=Number(prompt('Maximum HP','10'));if(!Number.isFinite(hp)||hp<1)return alert('Enter a valid positive HP value.');let ac=Number(prompt('Armor Class','12'));if(!Number.isFinite(ac)||ac<0)return;combatState().participants.push({id:uid(),name:n.trim(),kind:'Enemy',hp,maxHp:hp,ac,init:0,conditions:[],notes:''});combatLog('Added '+n.trim());save();render()}
function combatUpdate(id,key,value){let x=combatState().participants.find(p=>p.id===id);if(!x)return;if(['init','hp','maxHp','ac'].includes(key)){value=Number(value);if(!Number.isFinite(value))return;if(key==='maxHp'&&value<1)return;if(key==='hp')value=Math.min(value,x.maxHp);if(key==='ac'&&value<0)return}x[key]=value;save();render()}
function combatDamage(id,amount){let c=combatState(),x=c.participants.find(p=>p.id===id);if(!x)return;let before=x.hp;x.hp=Math.min(x.maxHp,Math.max(0,x.hp-amount));combatLog(x.name+(amount>=0?' took '+amount+' damage':' healed '+(-amount)+' HP')+' ('+before+' → '+x.hp+')');save();render()}
function combatCustomHP(id,heal){let n=Number(prompt(heal?'Heal how many HP?':'Deal how many damage?','5'));if(!Number.isFinite(n)||n<0)return;combatDamage(id,heal?-n:n)}
function combatToggleCondition(id,condition){let x=combatState().participants.find(p=>p.id===id);if(!x)return;x.conditions=x.conditions||[];let had=x.conditions.includes(condition);x.conditions=had?x.conditions.filter(y=>y!==condition):[...x.conditions,condition];combatLog(x.name+(had?' lost ':' gained ')+condition);save();render()}
function combatRemove(id){let c=combatState(),idx=c.participants.findIndex(x=>x.id===id);if(idx<0)return;if(!confirm('Remove '+c.participants[idx].name+' from this combat?'))return;combatLog('Removed '+c.participants[idx].name);c.participants.splice(idx,1);if(c.turn>=c.participants.length)c.turn=0;save();render()}
function combatSort(){let c=combatState();c.participants.sort((a,b)=>Number(b.init)-Number(a.init)||a.name.localeCompare(b.name));c.round=1;c.turn=0;c.active=true;combatLog('Combat started — initiative order set');save();render()}
function combatNext(){let c=combatState();if(!c.participants.length)return;if(!c.active){c.active=true;c.round=1;c.turn=0}else{c.turn++;if(c.turn>=c.participants.length){c.turn=0;c.round++}}combatLog('Turn: '+c.participants[c.turn].name+' (round '+c.round+')');save();render()}
function combatPrevious(){let c=combatState();if(!c.participants.length)return;if(c.turn===0){if(c.round>1){c.round--;c.turn=c.participants.length-1}}else c.turn--;save();render()}
function combatFinish(){let c=combatState();if(!confirm('Archive this encounter and clear current combatants?'))return;let summary=c.name+' — '+c.round+' rounds; '+c.participants.length+' combatants';db.encounters.push({id:uid(),name:c.name,location:db.campaign.location,status:'Completed',level:'',description:summary+'\n'+c.history.slice().reverse().map(h=>'Round '+h.round+': '+h.text).join('\n')});c.history.unshift({id:uid(),time:new Date().toLocaleString(),round:c.round,text:'ARCHIVED: '+summary});c.participants=[];c.round=1;c.turn=0;c.active=false;save();render();toast('Encounter archived in Encounters')}
function combatClearHistory(){if(!confirm('Clear combat log?'))return;combatState().history=[];save();render()}
function combatPage(){let c=combatState(), pcs=db.pcs.filter(p=>!c.participants.some(x=>x.pcId===p.id));return `<div class="headrow"><div><h2>⚔ DM Combat Tracker</h2><p class="muted">Initiative, HP, conditions, rounds and encounter history · All changes saved with your campaign.</p></div><button class="btn secondary" onclick="goto('encounters')">Encounter Library</button><button class="btn secondary" onclick="goto('music');musicShow('Encounter')">♫ Encounter Music</button></div>
<div class="card section"><div class="headrow"><label style="flex:1">Encounter name<input value="${esc(c.name)}" onchange="combatState().name=this.value;save()" aria-label="Encounter name"></label><div><b>Round ${c.round}</b> · ${c.active?'In progress':'Ready'}</div></div><div class="actions" style="flex-wrap:wrap"><button class="btn" onclick="combatSort()">Roll manually, then start / sort</button><button class="btn secondary" onclick="combatPrevious()">← Previous</button><button class="btn" onclick="combatNext()">Next turn →</button><button class="btn secondary" onclick="combatFinish()">Finish & archive</button></div><p class="meta">Enter each combatant’s initiative roll below, then select Start / Sort. Ties are sorted alphabetically; adjust rolls or turn order manually if needed. HP and conditions do not automatically sync back to player character sheets.</p></div>
<div class="card section"><h3>Add combatants</h3><div class="actions" style="flex-wrap:wrap"><select id="combatPcSelect" aria-label="Select PC"><option value="">Select player character…</option>${pcs.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.class||'PC')})</option>`).join('')}</select><button class="btn secondary" onclick="combatAddPC(document.getElementById('combatPcSelect').value)">+ Add PC</button><select id="combatPresetSelect" aria-label="Select enemy"><option value="spore">Spore Worker</option><option value="moldric">Maestro Moldric</option><option value="strider">Water Strider (placeholder stats)</option></select><button class="btn secondary" onclick="combatAddPreset(document.getElementById('combatPresetSelect').value)">+ Add enemy</button><button class="btn secondary" onclick="combatAddCustom()">+ Custom combatant</button></div></div>
<div class="section">${c.participants.length?c.participants.map((x,i)=>`<div class="card" style="margin-bottom:10px;${c.active&&i===c.turn?'border:2px solid var(--green);':''}"><div class="headrow"><h3 style="margin:0">${c.active&&i===c.turn?'➤ ':''}${esc(x.name)} <span class="pill">${esc(x.kind)}</span></h3><button class="link" onclick="combatRemove('${x.id}')">Remove</button></div><div class="combatgrid"><label>Initiative<input type="number" value="${esc(x.init)}" onchange="combatUpdate('${x.id}','init',this.value)"></label><label>HP<input type="number" value="${esc(x.hp)}" onchange="combatUpdate('${x.id}','hp',this.value)"></label><label>Max HP<input type="number" min="1" value="${esc(x.maxHp)}" onchange="combatUpdate('${x.id}','maxHp',this.value)"></label><label>AC<input type="number" value="${esc(x.ac)}" onchange="combatUpdate('${x.id}','ac',this.value)"></label></div><div class="actions" style="flex-wrap:wrap;margin-top:8px"><button class="btn secondary" onclick="combatDamage('${x.id}',1)">−1 HP</button><button class="btn secondary" onclick="combatDamage('${x.id}',5)">−5 HP</button><button class="btn secondary" onclick="combatCustomHP('${x.id}',false)">Damage…</button><button class="btn secondary" onclick="combatCustomHP('${x.id}',true)">Heal…</button></div><details style="margin-top:9px"><summary>Conditions (${(x.conditions||[]).length})</summary><div class="conditiongrid">${combatConditions.map(cond=>`<label><input type="checkbox" ${(x.conditions||[]).includes(cond)?'checked':''} onchange="combatToggleCondition('${x.id}','${cond}')"> ${cond}</label>`).join('')}</div></details><label>Combat notes<input value="${esc(x.notes||'')}" onchange="combatUpdate('${x.id}','notes',this.value)" placeholder="Concentration, resistances, tactics…"></label></div>`).join(''):'<div class="empty">No combatants yet. Add player characters or enemies above to begin.</div>'}</div>
<div class="card section"><div class="headrow"><h3>Combat history</h3><button class="btn secondary" onclick="combatClearHistory()">Clear log</button></div>${c.history.length?c.history.slice(0,80).map(h=>`<div class="item"><small>Round ${esc(h.round)} · ${esc(h.time)}</small> — ${esc(h.text)}</div>`).join(''):'<p class="muted">Damage, healing, conditions and turns will appear here.</p>'}</div>`}

function ensureExpansion(){if(!db.expansion||typeof db.expansion!=='object')db.expansion={};let e=db.expansion;
if(!Number.isFinite(e.supply))e.supply=0;if(!Array.isArray(e.ledger))e.ledger=[];if(!Array.isArray(e.buildings))e.buildings=[];
if(!Array.isArray(e.events))e.events=[];if(!Number.isFinite(e.rivalry))e.rivalry=0;if(!e.rivalNotes)e.rivalNotes={};
if(!e.materials||typeof e.materials!=='object')e.materials={};if(!Array.isArray(e.recipes))e.recipes=[];
if(!Array.isArray(e.items))e.items=[];if(!Array.isArray(e.projects))e.projects=[];if(!Array.isArray(e.evolutions))e.evolutions=[];
if(!Array.isArray(e.rewardKeys))e.rewardKeys=[];if(!Number.isFinite(e.eventCounter))e.eventCounter=0;}

const expansion=()=>{ensureExpansion();return db.expansion};
function htext(x){return esc(String(x??''))}
function addTimeline(name,details){db.events.push({id:uid(),name,date:db.campaign.date||'Current chapter',type:'Campaign Expansion',location:db.campaign.location||'Evergarden',details,status:'Recorded'})}
function changeSupply(amount,reason){if(!Number.isFinite(amount)||!Number.isInteger(amount)||Math.abs(amount)>1000)return;if(expansion().supply+amount<0){alert('Not enough Supply Tokens.');return}if(!reason||!reason.trim())return alert('Enter a reason for this ledger entry.');expansion().supply+=amount;expansion().ledger.unshift({id:uid(),amount,reason:reason.trim(),date:db.campaign.date});save();render();toast('Supply ledger updated')}
function supplyPrompt(sign){let n=Number(prompt('How many Supply Tokens?',sign>0?'2':'1'));if(!Number.isInteger(n)||n<=0||n>1000)return;let r=prompt('Source or reason for this change:');if(r!==null)changeSupply(sign*n,r)}
function villageBuild(id){let e=expansion(),b=BUILDINGS.find(x=>x[0]===id);if(!b||e.buildings.some(x=>x.id===id))return;let level=Number(prompt('Party level for unlock check (1–12):',db.pcs.length?Math.max(...db.pcs.map(p=>Number(p.level)||1)):3));if(!Number.isFinite(level))return;let tier=level>=9?3:level>=5?2:1;if(b[2]>tier)return alert('Requires higher party level: tier 2 at level 5, tier 3 at level 9.');if(b[2]>1&&e.buildings.filter(x=>BUILDINGS.find(b=>b[0]===x.id)?.[2]===b[2]-1).length<2)return alert('Construct at least two buildings from the prior tier first.');if(e.supply<b[3])return alert('Not enough supplies.');if(!confirm(`Begin ${b[1]} construction for ${b[3]} ST? Completion takes a village downtime week.`))return; e.buildings.push({id,status:'Under construction',started:db.campaign.date});e.supply-=b[3];e.ledger.unshift({id:uid(),amount:-b[3],reason:`Start ${b[1]}`,date:db.campaign.date});save();render()}
function finishBuilding(id){let x=expansion().buildings.find(b=>b.id===id);if(!x||x.status==='Constructed')return;if(!confirm('Confirm a seven-day village project has finished?'))return;x.status='Constructed';addTimeline('Village upgrade: '+BUILDINGS.find(b=>b[0]===id)[1],'Construction completed.');save();render()}
function villagePage(){let e=expansion();return `<div class="headrow"><div><h2>⌂ Dewdrop Hollow Village Builder</h2><p class="muted">Shared home base · Supply Tokens are not gold · Projects require seven in-game days.</p></div><span class="pill blue">${e.supply} Supply Tokens</span></div><div class="card section"><div class="headrow"><h3>Community supplies</h3><div class="actions"><button class="btn small" onclick="supplyPrompt(1)">+ Earn supplies</button><button class="btn small secondary" onclick="supplyPrompt(-1)">− Spend / adjust</button></div></div><p class="muted">Initial facilities: Hollow Stump Hall and Seed Storage (no combat bonuses). Official 2024 Bastion facilities remain separate.</p>${e.ledger.slice(0,7).map(l=>`<div class="item">${l.amount>0?'+':''}${l.amount} ST · ${htext(l.reason)} <small class="muted">${htext(l.date)}</small></div>`).join('')}</div><div class="grid">${BUILDINGS.map(b=>{let x=e.buildings.find(x=>x.id===b[0]);return `<div class="card"><div class="headrow"><h3>${htext(b[1])}</h3>${badge(x?.status||'Available')}</div><div class="muted">Tier ${b[2]} · ${b[3]} ST · Manager: ${htext(b[4])}</div><p>${htext(b[5])}</p><p class="muted"><b>Quest:</b> ${htext(b[6])}</p>${!x?`<button class="btn small" onclick="villageBuild('${b[0]}')">Start construction</button>`:x.status!=='Constructed'?`<button class="btn small" onclick="finishBuilding('${b[0]}')">Mark finished after downtime</button>`:'<span class="pill blue">✓ Built</span>'}</div>`}).join('')}</div>`}
function hazardRoll(){let e=expansion();e.eventCounter++;let index=(e.eventCounter*7+3)%HAZARDS.length;e.currentHazard=index;save();render()}
function hazardRecord(index){let a=HAZARDS[index],result=prompt('Outcome (success, partial success, failure, or narrative):','Success');if(result===null)return;expansion().events.unshift({id:uid(),name:a[0],result,date:db.campaign.date,notes:a[3]});addTimeline('Garden hazard: '+a[0],result);save();render();toast('Environmental event recorded')}
function hazardsPage(){let e=expansion(),idx=e.currentHazard??0,a=HAZARDS[idx];return `<div class="headrow"><div><h2>☁ Giants Among Us</h2><p class="muted">Telegraph threats; give players choices. Suggested DCs: level 1–4 = 10–12, 5–8 = 13–15, 9–12 = 15–17.</p></div><button class="btn" onclick="hazardRoll()">Generate event</button></div><div class="card section"><h3>${htext(a[0])}</h3><p>${htext(a[1])}</p><p><b>Example check:</b> ${htext(a[2])}</p><p><b>Challenge:</b> ${htext(a[3])}</p><p><b>Potential reward:</b> ${htext(a[4])}</p><button class="btn" onclick="hazardRecord(${idx})">Log event outcome</button></div><h3>Environmental event library</h3><div class="grid">${HAZARDS.map((a,i)=>`<div class="card"><h3>${htext(a[0])}</h3><p class="muted">${htext(a[1])}</p><button class="btn small secondary" onclick="expansion().currentHazard=${i};save();render()">Select event</button></div>`).join('')}</div><div class="card section"><h3>Recent outcomes</h3>${e.events.slice(0,12).map(x=>`<div class="item"><b>${htext(x.name)}</b> · ${htext(x.result)} <span class="muted">${htext(x.date)}</span></div>`).join('')||'<p class="muted">None recorded yet.</p>'}</div>`}
function rivalChange(delta){let e=expansion(),newValue=Math.max(-3,Math.min(3,e.rivalry+delta));if(newValue===e.rivalry)return;let reason=prompt('What decision changed the rivalry?');if(!reason?.trim())return;e.rivalry=newValue;addTimeline('Golden Stingers relationship '+(delta>0?'+1':'−1'),reason);save();render()}

function rivalsPage(){let e=expansion();return `<div class="headrow"><div><h2>♛ The Golden Stingers</h2><p class="muted">Competing adventurers who can become allies. Score −3 enemies to +3 trusted allies.</p></div><span class="pill blue">Rivalry ${e.rivalry>0?'+':''}${e.rivalry}</span></div><div class="card section"><h3>Party relationship</h3><p>${e.rivalry<=-2?'Hostile competitors':e.rivalry<0?'Distrustful rivals':e.rivalry===0?'Competitive but professional':e.rivalry<3?'Friendly rivals':'Trusted allies'}</p><div class="actions"><button class="btn" onclick="rivalChange(1)">+ Improve relationship</button><button class="btn secondary" onclick="rivalChange(-1)">− Worsen relationship</button></div></div><div class="grid">${RIVALS.map(r=>`<div class="card"><h3>${htext(r[1])}</h3><div class="muted">${htext(r[2])}</div><p>${htext(r[3])}</p><p class="muted">${htext(e.rivalNotes[r[0]]||'No individual story notes yet.')}</p><button class="btn small secondary" onclick="rivalNote('${r[0]}')">Edit relationship notes</button></div>`).join('')}</div><div class="card section"><h3>Rival quests by chapter</h3><p><b>Levels 2–3:</b> The Great Acorn Derby · <b>5–6:</b> The Treasure That Wasn’t There · <b>8–9:</b> A Stinger’s Last Stand</p><p class="muted">For combat, use level-appropriate NPC stat blocks rather than fully leveled player-character sheets.</p></div>`}
function materialAdjust(name,delta){let e=expansion(),v=Number(e.materials[name]||0)+delta;if(v<0)return;e.materials[name]=v;save();render()}
function learnRecipe(id){let e=expansion();if(!e.recipes.includes(id)){e.recipes.push(id);save();render()}}
function craftRecipe(id){let e=expansion(),r=RECIPES.find(r=>r[0]===id);if(!r||!e.recipes.includes(id))return;let p=db.pcs.filter(x=>Number(x.level)>=r[2]);if(!p.length)return alert('Add an eligible character at the required level first.');if(id!=='sporelantern'&&!e.buildings.some(x=>x.id==='forge'&&x.status==='Constructed'))return alert('Build the Beetle Forge first.');let mats=r[3].split(', ');if(mats.some(x=>(e.materials[x]||0)<1))return alert('Missing ingredients.');let recipient=prompt('Recipient character name (must match a character):',p[0].name);let pc=p.find(x=>x.name===recipient);if(!pc)return alert('Select an eligible character name.');if(!confirm(`Craft ${r[1]} for ${pc.name}? Confirm the DM-approved downtime project is complete; each ingredient will be consumed.`))return;mats.forEach(x=>e.materials[x]--);e.items.push({id:uid(),recipeId:id,name:r[1],pcId:pc.id,recipient:pc.name,date:db.campaign.date});addTimeline('Item crafted: '+r[1],pc.name+' crafted '+r[1]);save();render()}
function craftingPage(){let e=expansion();return `<div class="headrow"><div><h2>⚒ Nature’s Forge</h2><p class="muted">Materials, unlocked blueprints and custom magic items. Crafting is a DM-confirmed seven-day project.</p></div></div><div class="card section"><h3>Material inventory</h3><div class="grid">${MATERIALS.map(x=>`<div class="item"><b>${htext(x)}</b><div class="actions" style="margin-top:8px"><button class="btn small secondary" onclick="materialAdjust('${x}',-1)">−</button><b style="min-width:25px;text-align:center">${Number(e.materials[x]||0)}</b><button class="btn small secondary" onclick="materialAdjust('${x}',1)">+</button></div></div>`).join('')}</div></div><h3>Special recipes</h3><div class="grid">${RECIPES.map(r=>{let learned=e.recipes.includes(r[0]);return `<div class="card"><h3>${htext(r[1])}</h3><p class="muted">Recommended level ${r[2]}+ · ${htext(r[3])}</p><p>${htext(r[4])}</p>${!learned?`<button class="btn small" onclick="learnRecipe('${r[0]}')">Unlock blueprint</button>`:`<button class="btn small" onclick="craftRecipe('${r[0]}')">Craft (DM approve)</button>`}</div>`}).join('')}</div><div class="card section"><h3>Crafted items</h3>${e.items.map(it=>`<div class="item"><b>${htext(it.name)}</b> · ${htext(it.recipient)} <span class="muted">${htext(it.date)}</span></div>`).join('')||'<p class="muted">No items crafted yet.</p>'}<p class="muted">Record item effects on character sheets separately; crafting here does not silently change stats.</p></div>`}

function unlockEvolution(pcId,lv){let e=expansion(),pc=db.pcs.find(p=>p.id===pcId);if(!pc||Number(pc.level)<lv)return alert('Character has not reached the milestone level.');if(e.evolutions.some(x=>x.pcId===pcId&&x.level===lv))return;if(!confirm('Award this cosmetic miniature milestone? No character statistics will change.'))return;e.evolutions.push({id:uid(),pcId,level:lv,notes:'',date:db.campaign.date});addTimeline('Miniature evolution: '+pc.name,`Stage unlocked at level ${lv}`);save();render()}

function mapCols(m){return Number.isInteger(m?.cols)&&m.cols>=4&&m.cols<=100?m.cols:MAP_COLS}

function mapState(){
 if(!db.maps||!Array.isArray(db.maps.scenes))db.maps={scenes:clone(MAP_START),active:'map-dewdrop',selected:null,showGrid:true,history:[]};
 const ms=db.maps;
 if(!Array.isArray(ms.history))ms.history=[];
 if(!ms.viewMode)ms.viewMode='dm';
 if(!ms.fogTool)ms.fogTool='off';
 if(!Array.isArray(ms.archivedScenes))ms.archivedScenes=[];
 // One-time, reversible retirement. Preserve every prior map (including tokens,
 // custom art, fog and metadata) without deleting any character or encounter data.
 if(!ms.homeHiveOfficialV1){
  const all=Array.isArray(ms.scenes)?ms.scenes:[];
  const home=all.find(m=>m.id==='evergarden-home-hive')||clone(EVERGARDEN_SCENES[0]);
  home.cols=30;home.rows=30;home.asset='home-hive';
  home.name='Home Hive';
  home.desc='Official Evergarden home village — Council Acorn, market, defenses and root hollow';
  home.playerShared=true;
  for(const old of all)if(old.id!==home.id&&!ms.archivedScenes.some(a=>a.id===old.id))ms.archivedScenes.push(old);
  ms.scenes=[home];ms.active=home.id;ms.selected=null;ms.fogTool='off';
  ms.homeHiveOfficialV1=true;
  ms.evergardenSeeded=true;
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('Home Hive map migration could not be saved; export a backup',e)}
 }
 if(!ms.scenes.length)ms.scenes=[clone(EVERGARDEN_SCENES[0])];
 if(!ms.scenes.some(m=>m.id===ms.active))ms.active=ms.scenes[0].id;
 return ms;
}

let heading=`<div class="headrow"><div><h2>🗺 Battle Maps & Tokens</h2><p class="muted">Illustrated battlemaps with DM controls, player-safe display and paintable fog of war.</p></div><div class="map-mode-buttons"><button class="btn ${player?'secondary':''}" onclick="mapSetView('dm')">⚙ DM View</button><button class="btn ${player?'':'secondary'}" onclick="mapSetView('player')">◉ Player View</button></div></div>`;

<div class="card"><h3>On this map <span class="pill">${m.tokens.length}</span></h3><div class="map-roster-list">${m.tokens.map(o=>`<button class="map-roster-item ${ms.selected===o.id?'active':''}" onclick="mapSelect('${esc(o.id)}')"><span>${o.kind==='pc'?'★':o.kind==='npc'?'●':'⚔'}</span> ${esc(tokenLabel(o))} <small>${o.x+1},${o.y+1}</small></button>`).join('')||'<p class="muted">No tokens yet. Add PCs or NPCs to begin.</p>'}</div></div>
<div class="card"><h3>Last movements</h3><div class="map-log">${ms.history.filter(h=>h.map===m.id).slice(0,6).map(h=>`<div class="item"><small>${esc(h.text)}</small></div>`).join('')||'<p class="muted">Movement history will appear here.</p>'}</div></div></div></div>`}
function mapSetView(v){let ms=mapState();if(v==='dm'&&ms.viewMode==='player'&&!confirm('Return to DM View? Hidden maps, tokens and notes may become visible on this screen.'))return;if(v==='player'&&!mapAvailable(currentMap()))currentMap().playerShared=true;ms.viewMode=v==='player'?'player':'dm';ms.fogTool='off';save();render()}

function mapFogAll(reveal){currentMap().revealed=reveal?Array.from({length:mapRows(currentMap())*mapCols(currentMap())},(_,i)=>i):[];save();render()}
function mapPaintFog(idx){let m=currentMap(),ms=mapState();if(ms.fogTool==='off'||idx<0||idx>=mapRows(m)*mapCols(m))return;let fog=mapFog(m),has=fog.includes(idx);if(ms.fogTool==='reveal'&&!has)fog.push(idx);if(ms.fogTool==='hide'&&has)m.revealed=fog.filter(i=>i!==idx);let cell=document.querySelector(`[data-fog-cell="${idx}"]`);if(cell)cell.className=ms.fogTool==='reveal'?'fog-clear':'fog-cell';save()}

async function mapUploadImage(event){let file=event.target.files?.[0];event.target.value='';if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type))return alert('Choose a PNG, JPG or WebP image.');if(file.size>2*1024*1024)return alert('Choose an image smaller than 2 MB.');let target=currentMap();let previous=target.imageData;try{let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Unable to read image'));r.readAsDataURL(file)});target.imageData=data;localStorage.setItem(KEY,JSON.stringify(db));render();toast('Map background saved')}catch(err){target.imageData=previous;alert('Could not save map image. Try a smaller compressed image or export a backup to free storage.')}}

function mapAddRecord(){let val=document.getElementById('map-roster').value;if(!val)return alert('Choose an existing PC or NPC.');let [kind,ref]=val.split(':');let existing=currentMap().tokens.find(t=>t.kind===kind&&t.ref===ref);if(existing){mapState().selected=existing.id;render();toast('Character already on map');return}let rec=findTokenRecord({kind,ref});if(!rec)return;let pos=mapOpenCell(currentMap()),o={id:uid(),kind,ref,name:rec.name,x:pos.x,y:pos.y,hp:'',condition:''};currentMap().tokens.push(o);mapState().selected=o.id;save();render();toast('Token placed')}

document.addEventListener('pointerdown',e=>{if(page!=='maps'||mapState().viewMode==='player'||mapState().fogTool==='off')return;if(!e.target.closest('#map-board'))return;mapFogPainting=true;e.preventDefault();let r=document.getElementById('map-board').getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*mapCols(currentMap())),y=Math.floor((e.clientY-r.top)/r.height*mapRows(currentMap()));mapPaintFog(mapIndex(currentMap(),x,y))});
document.addEventListener('pointermove',e=>{if(!mapFogPainting||page!=='maps')return;let b=document.getElementById('map-board');if(!b)return;let r=b.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*mapCols(currentMap())),y=Math.floor((e.clientY-r.top)/r.height*mapRows(currentMap()));if(x>=0&&x<mapCols(currentMap())&&y>=0&&y<mapRows(currentMap()))mapPaintFog(mapIndex(currentMap(),x,y))});
document.addEventListener('pointerup',()=>mapFogPainting=false);document.addEventListener('pointercancel',()=>mapFogPainting=false);

function mapCoords(board,e){let r=board.getBoundingClientRect();return {x:Math.max(0,Math.min(mapCols(currentMap())-1,Math.floor((e.clientX-r.left)/r.width*mapCols(currentMap())))),y:Math.max(0,Math.min(mapRows(currentMap())-1,Math.floor((e.clientY-r.top)/r.height*mapRows(currentMap()))))}}
document.addEventListener('pointerdown',e=>{if(page!=='maps'||mapState().viewMode==='player'||mapState().fogTool!=='off')return;let el=e.target.closest('.map-token');if(!el)return;let t=currentMap().tokens.find(t=>t.id===el.dataset.token);if(!t)return;e.preventDefault();mapState().selected=t.id;mapDrag={id:t.id,fromX:e.clientX,fromY:e.clientY,active:false,el};try{el.setPointerCapture(e.pointerId)}catch(_){};document.querySelectorAll('.map-token').forEach(x=>x.classList.toggle('is-selected',x===el))});
document.addEventListener('pointermove',e=>{if(!mapDrag||page!=='maps'||mapState().viewMode==='player')return;let b=document.getElementById('map-board');if(!b)return;if(Math.hypot(e.clientX-mapDrag.fromX,e.clientY-mapDrag.fromY)>4)mapDrag.active=true;if(mapDrag.active){let p=mapCoords(b,e);mapDrag.el.style.left=((p.x+.5)/mapCols(currentMap())*100)+'%';mapDrag.el.style.top=((p.y+.5)/mapRows(currentMap())*100)+'%'}});
document.addEventListener('pointerup',e=>{if(!mapDrag)return;let d=mapDrag;mapDrag=null;if(page!=='maps'||mapState().viewMode==='player')return;let b=document.getElementById('map-board'),t=currentMap().tokens.find(x=>x.id===d.id);if(!t||!b)return;if(d.active){let p=mapCoords(b,e);mapMove(t,p.x,p.y)}else render()});
document.addEventListener('click',e=>{if(page!=='maps'||mapDrag||mapState().viewMode==='player'||mapState().fogTool!=='off')return;let b=e.target.closest('#map-board');if(!b||e.target.closest('.map-token'))return;let t=currentMap().tokens.find(x=>x.id===mapState().selected);if(!t)return;let p=mapCoords(b,e);mapMove(t,p.x,p.y)});
document.addEventListener('keydown',e=>{if(page!=='maps'||mapState().viewMode==='player'||mapState().fogTool!=='off'||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;let t=currentMap().tokens.find(x=>x.id===mapState().selected);if(!t)return;e.preventDefault();let x=t.x+(e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0),y=t.y+(e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0);mapMove(t,x,y)});

function render(){mapState();navRender();document.getElementById('app').innerHTML=page==='dashboard'?dash():page==='settings'?settings():page==='leveling'?levelingPage():page==='sheet'?sheetPage():page==='combat'?combatPage():page==='music'?musicPage():page==='village'?villagePage():page==='hazards'?hazardsPage():page==='rivals'?rivalsPage():page==='crafting'?craftingPage():page==='evolution'?evolutionPage():page==='maps'?mapsPage():listpage(page)}function fld(spec,val){let [key,title,type,options]=spec;let v=val?.[key]??'';let input=type==='textarea'?`<textarea name="${key}">${esc(v)}</textarea>`:type==='select'?`<select name="${key}">${options.split('|').map(x=>`<option value="${esc(x)}" ${String(v)===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" value="${esc(v)}" ${key==='name'?'required':''} ${key==='reputation'?'min="-3" max="3"':''}>`;return `<div class="field ${type==='textarea'?'full':''}"><label for="">${esc(title)}</label>${input}</div>`}let editing=null;function add(k){editing={k,id:null};openEditor(k,null)}function edit(k,id){editing={k,id};openEditor(k,db[k].find(x=>x.id===id))}function openEditor(k,data){document.getElementById('modalTitle').textContent=(data?'Edit ':'Add ')+singular[k];document.getElementById('modalFields').innerHTML=`<div class="formgrid">${schemas[k].map(s=>fld(s,data)).join('')}</div>`;document.getElementById('editor').showModal()}function editCampaign(){editing={k:'campaign'};document.getElementById('modalTitle').textContent='Campaign settings';document.getElementById('modalFields').innerHTML=`<div class="formgrid">${[['name','Campaign name','text'],['date','Current in-game date','text'],['location','Current location','text'],['session','Current session number','number'],['description','Campaign pitch','textarea'],['dmNotes','DM-only notes','textarea']].map(s=>fld(s,db.campaign)).join('')}</div>`;document.getElementById('editor').showModal()}document.getElementById('editForm').onsubmit=e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.target).entries());['level','hp','ac','reputation','session','constitution','maxHp'].forEach(k=>{if(k in values&&values[k]!=='')values[k]=Number(values[k])});if(editing.k==='campaign'){db.campaign={...db.campaign,...values}}else if(editing.k==='music'){if(values.url&&!/^https:\/\/open\.spotify\.com\/(track|album|playlist|search|artist|episode|show)\//.test(values.url)){alert('Use a Spotify link beginning with https://open.spotify.com/ or leave the URL blank.');return}if(!values.name?.trim()){alert('Enter a cue name.');return}if(editing.id){Object.assign(db.music.find(x=>x.id===editing.id),values)}else db.music.push({id:uid(),...values})}else if(editing.id){let old=db[editing.k].find(x=>x.id===editing.id);Object.assign(old,values)}else db[editing.k].push({id:uid(),...values});save();document.getElementById('editor').close();render();toast('Record saved')};function del(k,id){let x=db[k].find(x=>x.id===id);if(!confirm('Delete '+(x.name||x.from+' → '+x.to)+'? This cannot be undone.'))return;db[k]=db[k].filter(x=>x.id!==id);save();render();toast('Record deleted')}function exportData(){let blob=new Blob([JSON.stringify({app:'The Shattered Hive Campaign Chronicle',version:8,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shattered-hive-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}// Import a SINGLE spoiler-free hero; never replace or modify unrelated campaign records.
const BUG_SPECIES={Beetle:'Beetlekin',Ant:'Antfolk','Praying Mantis':'Mantisborn',Moth:'Mothkin',Spider:'Spiderkin',Firefly:'Firefly Folk'};
function heroText(v){return typeof v==='string'?v.trim().slice(0,600):''}
async function importBugHero(e){
 const f=e.target.files?.[0];if(!f)return;
 try{
  if(f.size>100000)throw Error('Hero file is too large (100 KB maximum).');
  const payload=JSON.parse(await f.text());
  if(payload?.app!=='The Shattered Hive Bug Hero Creator'||payload.version!==1||!payload.hero||typeof payload.hero!=='object'||Array.isArray(payload.hero))throw Error('Choose a JSON file exported from Bug Hero Creator. Campaign backups use the separate Import button.');
  const h=payload.hero;
  if(typeof h.name!=='string'||!h.name.trim()||h.name.length>60||!Object.hasOwn(BUG_SPECIES,h.bug))throw Error('The hero needs a valid name and bug species.');
  const hero={name:heroText(h.name),bug:h.bug,power:heroText(h.power),gear:heroText(h.gear),trait:heroText(h.trait),colors:heroText(h.colors),outfit:heroText(h.outfit),fear:heroText(h.fear),dream:heroText(h.dream),extra:heroText(h.extra)};
  const fingerprint=JSON.stringify(hero);
  if(db.pcs.some(pc=>pc.bugHeroFingerprint===fingerprint))throw Error('This exact hero has already been imported. You can edit the existing PC instead.');
  if(db.pcs.some(pc=>pc.name.trim().toLowerCase()===hero.name.toLowerCase())){
   if(!confirm('A PC named "'+hero.name+'" already exists. Import a separate character with the same name?'))return;
  }
  const lines=[['Chosen power',hero.power],['Preferred gear',hero.gear],['Personality',hero.trait],['Colors',hero.colors],['Appearance',hero.outfit],['Biggest fear',hero.fear],['Biggest dream',hero.dream],['Special details',hero.extra]];
  const pc={id:uid(),name:hero.name,species:BUG_SPECIES[hero.bug],class:'Unassigned',level:1,player:'',background:'',location:'Tinsel Hollow',status:'Active',notes:'Imported from Bug Hero Creator. D&D 5e (2024) class, ability scores, HP, AC, and starting equipment require DM approval.\n'+lines.filter(row=>row[1]).map(row=>row[0]+': '+row[1]).join('\n'),secret:'',bugHero:hero,bugHeroFingerprint:fingerprint};
  db.pcs.push(pc);
  save();page='pcs';query='';render();toast(hero.name+' imported!');
  alert('Imported '+hero.name+' as a level-1 '+pc.species+'!\n\nNext: Open View / Edit to choose a class, then complete the Character Sheet. No D&D statistics or equipment were assigned automatically.');
 }catch(err){alert('Hero import failed: '+err.message)}finally{e.target.value=''}
}
async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());let d=v.data||v;if(!d.campaign||!Array.isArray(d.npcs)||!Array.isArray(d.quests))throw Error('Not a valid campaign backup.');if(!confirm('Replace all current data with this backup? Export your current data first if needed.'))return;db=d;for(let k in initial)if(!(k in db))db[k]=clone(initial[k]);if(!Array.isArray(db.music))db.music=clone(MUSIC_STARTER);ensureExpansion();save();goto('dashboard');toast('Backup imported')}catch(ex){alert('Import failed: '+ex.message)}finally{e.target.value=''}}function resetData(){if(!confirm('Reset ALL campaign data to the original starter content? This will erase edits.'))return;if(!confirm('Last chance: have you exported a backup?'))return;db=clone(initial);db.music=clone(MUSIC_STARTER);ensureExpansion();save();goto('dashboard');toast('Campaign reset')}render();
</script></body></html>
