name: HDMI TV player display browser tests
on:
  push:
    branches: [feature/hdmi-tv-player-display]
  pull_request:
    paths:
      - 'player-display.html'
      - 'tests/tv-player-display-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tv-display:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test television player projection
        run: node tests/tv-player-display-smoke.cjs
