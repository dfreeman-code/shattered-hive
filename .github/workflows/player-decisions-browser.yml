name: Player Decisions browser tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/player-decisions.cjs'
      - '.github/workflows/player-decisions-browser.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run end-to-end browser tests
        run: node tests/player-decisions.cjs
