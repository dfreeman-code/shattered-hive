name: Cloud Sync 2.1 browser regression
on:
  pull_request:
    paths:
      - 'assets/cloud-sync.js'
      - 'tests/cloud-sync-2-1.smoke.cjs'
      - '.github/workflows/cloud-sync-2-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve candidate app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hive-cloud21-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
      - name: Test Cloud Sync 2.1 in isolated browser
        run: node tests/cloud-sync-2-1.smoke.cjs
