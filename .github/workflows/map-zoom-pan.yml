name: Map zoom and pan browser tests
on:
  push:
    branches: [feature/immersive-tabletop-zoom-pan]
  pull_request:
    paths:
      - 'index.html'
      - 'tests/map-zoom-pan-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify enlarged map zoom, pan and privacy
        run: node tests/map-zoom-pan-smoke.cjs
