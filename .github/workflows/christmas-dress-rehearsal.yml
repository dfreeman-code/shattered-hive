name: Christmas Caper full dress rehearsal
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/christmas-dress-rehearsal.cjs'
      - '.github/workflows/christmas-dress-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run disposable ten-scene rehearsal
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/christmas-rehearsal-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          node tests/christmas-dress-rehearsal.cjs
      - name: Upload rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christmas-dress-rehearsal
          path: christmas-dress-rehearsal-results.json
          if-no-files-found: ignore
