name: Isolated browser QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/browser-smoke.cjs'
      - 'tests/multitab-save-guard.cjs'
      - 'tests/storage-failure-recovery.cjs'
      - 'tests/map-startup-migration-safety.cjs'
      - 'tests/campaign-data-integrity.cjs'
      - 'tests/phase7-readiness-audit.cjs'
      - 'tests/vismund-approved-equipment.cjs'
      - 'tests/david-rogue-equipment.cjs'
      - 'tests/david-final-approved-choices.cjs'
      - 'tests/snoop-warlock-clarifications.cjs'
      - 'tests/newton-ranger-option-a.cjs'
      - 'tests/mister-potts-playing-cards-21gp.cjs'
      - '.github/workflows/isolated-browser-qa.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright in runner only
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run isolated local browser smoke tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/shattered-hive-qa-server.log 2>&1 &
          sleep 2
          node tests/browser-smoke.cjs
          node tests/multitab-save-guard.cjs
          node tests/storage-failure-recovery.cjs
          node tests/map-startup-migration-safety.cjs
          node tests/campaign-data-integrity.cjs
          node tests/phase7-readiness-audit.cjs
          node tests/vismund-approved-equipment.cjs
          node tests/david-rogue-equipment.cjs
          node tests/david-final-approved-choices.cjs
          node tests/snoop-warlock-clarifications.cjs
          node tests/newton-ranger-option-a.cjs
          node tests/mister-potts-playing-cards-21gp.cjs
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-qa-results
          path: |
            qa-smoke-results.json
            /tmp/shattered-hive-qa-server.log
          if-no-files-found: ignore
