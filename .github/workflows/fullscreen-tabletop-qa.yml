name: Full-screen tabletop browser tests
on:
  push:
    branches: [feature/fullscreen-tabletop-mode]
  pull_request:
    paths:
      - 'index.html'
      - 'tests/fullscreen-tabletop-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tabletop-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run isolated full-screen tabletop browser regression
        run: node tests/fullscreen-tabletop-smoke.cjs
