name: Fog 2 wall-aware exploration browser tests
on:
  push:
    branches: [feature/fog-2-wall-aware-exploration]
  pull_request:
    paths:
      - 'index.html'
      - 'player-display.html'
      - 'tests/fog-2-vision-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fog-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test Fog 2 vision
        run: node tests/fog-2-vision-smoke.cjs
