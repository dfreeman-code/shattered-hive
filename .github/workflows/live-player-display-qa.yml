name: Live two-tab player display browser tests
on:
  push:
    branches: [feature/live-two-tab-player-display]
  pull_request:
    paths:
      - 'index.html'
      - 'player-display.html'
      - 'tests/live-player-display-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-player-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify filtered live player display
        run: node tests/live-player-display-smoke.cjs
