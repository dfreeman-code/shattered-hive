name: Vertical journey story maps
on:
  push:
    branches: [feature/vertical-journey-detailed-map-expansion]
  pull_request:
    paths:
      - 'index.html'
      - 'assets/maps/world-redesign/*-tall.svg'
      - 'tests/vertical-journey-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vertical-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify taller maps, state migration and HDMI privacy
        run: node tests/vertical-journey-smoke.cjs
