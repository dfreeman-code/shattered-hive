name: Top-down Mushroom Market safe addition
on:
  push:
    branches: [feature/topdown-mushroom-market-v1]
  pull_request:
    paths:
      - 'index.html'
      - 'assets/maps/mushroom-market-approved-top-down.webp'
      - 'tests/topdown-mushroom-market-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mushroom-market:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check opt-in Mushroom Market and TV safety
        run: node tests/topdown-mushroom-market-smoke.cjs
