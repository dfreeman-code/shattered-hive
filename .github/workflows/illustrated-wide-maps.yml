name: Illustrated widescreen battle maps
on:
  push:
    branches: [feature/illustrated-wide-map-extensions]
  pull_request:
    paths:
      - 'index.html'
      - 'player-display.html'
      - 'assets/maps/expansions/**'
      - 'tests/illustrated-wide-maps-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify 50-percent wider illustrated maps
        run: node tests/illustrated-wide-maps-smoke.cjs
