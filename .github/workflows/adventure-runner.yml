name: Vesper Adventure Runner browser tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/adventure-runner.smoke.cjs'
      - '.github/workflows/adventure-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adventure-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve local candidate app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hive-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
      - name: Test Adventure Runner with disposable data
        run: node tests/adventure-runner.smoke.cjs
