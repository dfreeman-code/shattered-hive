<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>The Shattered Hive · Live Player Display</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101c17;color:#f3f3e9}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#203b30;border-bottom:1px solid #57735a;flex-wrap:wrap}
.brand{font:700 20px Georgia,serif;letter-spacing:.01em}
.status{font-size:13px;color:#eee6cd;display:flex;align-items:center;gap:8px}
.status::before{content:"";display:block;width:9px;height:9px;border-radius:50%;background:#d7ae6f}
.status[data-online="true"]::before{background:#85d9a7}
button{background:#e9e4ce;border:0;border-radius:8px;color:#1d3527;font:600 13px system-ui;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:3px solid #f1ce75;outline-offset:3px}
main{display:flex;flex:1;min-height:0;align-items:center;justify-content:center;padding:10px}
.placeholder{text-align:center;max-width:520px;line-height:1.65;color:#e1e2d3;padding:30px}
.placeholder h1{font:700 30px Georgia,serif;margin:0 0 8px}
.board{position:relative;max-width:100%;max-height:100%;width:min(calc(100vw - 20px),calc((100dvh - 116px)*var(--ratio,1)));aspect-ratio:var(--cols,30)/var(--rows,30);flex-shrink:0;border:5px solid #806748;border-radius:14px;overflow:hidden;box-shadow:0 14px 50px #0009;background:linear-gradient(135deg,#668c67,#9fbd8d)}
.board[data-theme="christmas"]{background:linear-gradient(140deg,#b1d2d1,#e5e4ee)}
.board[data-theme="tunnel"]{background:linear-gradient(140deg,#503e34,#8d7a68)}
.art,.grid,.tokens,.fog{position:absolute;inset:0;width:100%;height:100%}
.art img{width:100%;height:100%;object-fit:fill;display:block}
.grid{pointer-events:none;background-image:linear-gradient(to right,#213e3850 1px,transparent 1px),linear-gradient(to bottom,#213e3850 1px,transparent 1px);background-size:calc(100% / var(--cols)) calc(100% / var(--rows));z-index:1}
.tokens{pointer-events:none;z-index:2}
.token{position:absolute;transform:translate(-50%,-50%);border-radius:50%;width:min(var(--hero-width,5%),var(--hero-max,52px));aspect-ratio:1;background:#3167ad;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(12px,1.5vw,22px);box-shadow:0 2px 8px #0009;z-index:2}
.token.other{width:calc(100% / var(--cols))}
.token img{width:100%;height:100%;object-fit:contain;border-radius:50%;position:absolute;inset:0}
.token .symbol{position:relative;z-index:0;font-weight:800}
.token .label{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;text-shadow:-1px -1px 3px #111,1px 1px 3px #111;z-index:3}
.fog{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));pointer-events:none;z-index:4}
.fog div{background:#0b1713}
.fog div.revealed{background:transparent}
.fog div.explored{background:#0b1713ad}
footer{text-align:center;padding:6px 12px;background:#203b30;color:#d4ddcc;font-size:12px;min-height:30px}
@media(max-width:700px){.brand{font-size:16px}.board{width:min(calc(100vw - 10px),calc((100dvh - 148px)*var(--ratio,1)))}header{padding:7px}main{padding:5px}}
.territory-art{background-color:#779b7b;background-image:radial-gradient(ellipse at 17% 22%,#b4c99380 0 9%,transparent 24%),radial-gradient(ellipse at 89% 85%,#c2a87970 0 10%,transparent 26%),radial-gradient(ellipse at 82% 21%,#638b7860 0 8%,transparent 24%),repeating-linear-gradient(145deg,#44644522 0 4px,transparent 5px 74px)}
.board[data-theme="christmas"] .territory-art,.board[data-theme="puddle"] .territory-art{background-color:#a9c8cb}
.board[data-theme="tunnel"] .territory-art,.board[data-theme="log"] .territory-art{background-color:#7d6853}
.board[data-theme="ornament"] .territory-art{background-color:#b7b2c6}
.territory-core{overflow:hidden;box-shadow:0 0 40px #0e28152a}

/* HDMI / living-room presentation. No private controls or state on this page. */
body.tv-mode{background:#050b09}
body.tv-mode header,body.tv-mode footer{display:none}
body.tv-mode main{padding:0;background:#050b09}
body.tv-mode .board{border:0;border-radius:0;box-shadow:none;width:min(100vw,calc(100dvh * var(--ratio,1)));max-width:100%;max-height:100dvh}
body.tv-mode .token{--hero-max:clamp(60px,5vw,100px)!important;border-width:4px;box-shadow:0 2px 13px #000c,0 0 0 2px #f0e5c6b8}
body.tv-mode .token.other{width:calc(100% / var(--cols));min-width:0}
body.tv-mode .token .label{font-size:clamp(15px,1.3vw,24px);font-weight:850;bottom:calc(100% + 5px);padding:2px 6px;border-radius:5px;background:#081611cf;text-shadow:0 2px 3px #000}
body.tv-mode .token .symbol{font-size:clamp(20px,2vw,35px)}
body.tv-mode .placeholder{max-width:900px}
body.tv-mode .placeholder h1{font-size:clamp(30px,4vw,58px)}
body.tv-mode .placeholder p{font-size:clamp(18px,2vw,30px)}
#tv-hud{display:none;pointer-events:none;position:fixed;inset:0;z-index:20}
body.tv-mode #tv-hud{display:block}
#tv-hud-scene{position:absolute;top:max(16px,2vh);left:max(16px,2vw);max-width:60vw;background:#0b1f19dc;border:1px solid #9db7a077;border-radius:10px;padding:8px 14px;color:#fff5d8;text-shadow:0 1px 4px #000;box-shadow:0 4px 12px #0007;font-size:clamp(16px,1.55vw,27px);font-weight:750}
#tv-hud-status{position:absolute;bottom:max(12px,1.8vh);right:max(14px,1.7vw);border-radius:20px;padding:7px 12px;background:#10261ddc;font-weight:700;font-size:clamp(13px,1vw,18px);color:#d8e3d3}
#tv-hud-status[data-online="false"]{background:#4d2925ed;color:#ffe0d6}
#tv-hud-status[data-online="true"]::before{content:"● ";color:#88dc9b}
#tv-mode-exit{display:none;position:fixed;z-index:30;top:12px;right:14px;opacity:.1;transition:opacity .15s}
body.tv-mode #tv-mode-exit{display:block}
body.tv-mode #tv-mode-exit:hover,body.tv-mode #tv-mode-exit:focus-visible{opacity:1}
@media(prefers-reduced-motion:reduce){#tv-mode-exit{transition:none}}
/* Player-only cards; no changes to fog/token geometry or saved campaign state. */
.party-hud{display:none;position:fixed;left:0;right:0;z-index:23;pointer-events:none;padding:6px clamp(8px,1.4vw,24px);gap:clamp(6px,1vw,16px);grid-template-columns:repeat(3,minmax(0,1fr));}
body.tv-mode.party-hud-on .party-hud:not(:empty){display:grid}
/* Keep status cards inside TV safe area rather than against overscanned edges. */
#party-top{top:clamp(24px,3.2vh,44px)}
#party-bottom{bottom:clamp(20px,2.8vh,38px)}
.party-empty{grid-column:1/-1;text-align:center;color:#f8d4a7;font-weight:700;font-size:clamp(13px,1.15vw,19px)}
.party-card{min-width:0;min-height:72px;padding:8px 13px;border:1px solid #c2b78b;border-radius:10px;background:#10271ff5;color:#fff5dc;box-shadow:0 2px 15px #000b}
.party-card-main{display:flex;gap:9px;align-items:center;min-width:0}
.party-portrait{width:clamp(46px,4.5vw,76px);height:clamp(46px,4.5vw,76px);flex:none;border:2px solid #d4c490;border-radius:10px;object-fit:cover;background:#29483d}
.party-card-info{min-width:0;flex:1}
.party-slots{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;font-size:clamp(10px,.9vw,15px);font-weight:750;color:#aadaef}
.party-slot{border:1px solid #668b9b;border-radius:5px;padding:1px 5px;background:#173543}
@media(max-width:900px){.party-portrait{width:40px;height:40px}.party-card-main{gap:5px}.party-slots{gap:2px}}
.party-card strong{display:block;font:750 clamp(12px,1.12vw,19px) Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party-card .party-meta{font-size:clamp(10px,.86vw,14px);color:#d3dfcf}
.party-card .party-stats{display:flex;gap:clamp(7px,1.1vw,22px);flex-wrap:wrap;font-size:clamp(12px,1.12vw,20px);font-weight:800;margin-top:3px}
.party-card .party-effect{font-size:clamp(10px,.8vw,13px);color:#ffe19a;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
body.tv-mode.party-hud-on main{padding:90px 0;min-height:0}
body.tv-mode.party-hud-on.tv-fit .board{width:min(100vw,calc((100dvh - 180px)*var(--ratio,1)));max-height:calc(100dvh - 180px)}
body.tv-mode.party-hud-on.tv-fill .board{width:max(100vw,calc((100dvh - 180px)*var(--ratio,1)))}
@media(max-height:650px){body.tv-mode.party-hud-on main{padding:70px 0}body.tv-mode.party-hud-on.tv-fit .board{width:min(100vw,calc((100dvh - 140px)*var(--ratio,1)));max-height:calc(100dvh - 140px)}body.tv-mode.party-hud-on.tv-fill .board{width:max(100vw,calc((100dvh - 140px)*var(--ratio,1)))}.party-card{min-height:57px;padding:4px 9px}}
@media(max-width:700px){.party-hud{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px}.party-card{padding:4px;font-size:11px}.party-card .party-stats{gap:5px}.party-card .party-meta{display:none}}


/* TV camera: immersive cover framing preserves the same full-resolution fog and token coordinate system. */
body.tv-mode.tv-fill main{overflow:hidden}
body.tv-mode.tv-fill .board{width:max(100vw,calc(100dvh * var(--ratio,1)));min-width:0;max-width:none;max-height:none;flex-shrink:0}
body.tv-mode.tv-fit .board{width:min(100vw,calc(100dvh * var(--ratio,1)));max-width:100%;max-height:100dvh}
/* Keep camera controls in the map-side lane rather than across the top hero cards.
   Use the vertical center and allow scrolling on short TV viewports. */
#tv-camera-controls{display:none;position:fixed;z-index:32;top:50%;right:clamp(12px,1.4vw,24px);transform:translateY(-50%);flex-direction:column;gap:6px;align-items:stretch;max-height:calc(100dvh - 230px);overflow-y:auto;max-width:min(190px,35vw)}
body.tv-mode #tv-camera-controls{display:flex}
#tv-camera-controls button{font-size:13px;background:#122d25e6;color:#fff6de;border:1px solid #d6ddb577}
#tv-camera-controls button[aria-pressed="true"]{background:#d4c79b;color:#1e3529}
#tv-camera-controls button:focus-visible{outline:3px solid #ffdc75}
.map-ambient{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.map-ambient .mote{position:absolute;width:var(--mote-size,9px);height:var(--mote-size,9px);border-radius:50%;left:var(--mote-x);top:var(--mote-y);background:radial-gradient(circle,#fffdea 0%,#e4d59999 30%,transparent 70%);filter:drop-shadow(0 0 5px #fff6c1b0);animation:map-mote-drift var(--mote-duration,7s) ease-in-out infinite alternate,map-mote-glow calc(var(--mote-duration,7s)*.65) ease-in-out infinite alternate;animation-delay:var(--mote-delay,0s)}
.map-ambient .glint{position:absolute;width:34px;height:34px;left:var(--mote-x);top:var(--mote-y);background:radial-gradient(circle,#fff9d6 0%,#fff7d7aa 12%,transparent 48%);animation:map-mote-glow var(--mote-duration,7s) ease-in-out infinite alternate;animation-delay:var(--mote-delay,0s)}
@keyframes map-mote-drift{from{transform:translate3d(-7px,5px,0)}to{transform:translate3d(10px,-13px,0)}}
@keyframes map-mote-glow{from{opacity:.16}to{opacity:.7}}
body.ambient-off .map-ambient{display:none}
@media(prefers-reduced-motion:reduce){.map-ambient .mote,.map-ambient .glint{animation:none;opacity:.24}}
@media(max-width:760px){#tv-camera-controls{top:57px;right:10px}#tv-camera-controls button{font-size:12px;padding:6px}}
/* Height-aware HUD bands keep portraits/slot badges clear of the battle map. */
body.tv-mode.party-hud-on{--party-band:clamp(100px,12vh,136px)}
body.tv-mode.party-hud-on main{padding:var(--party-band) 0}
body.tv-mode.party-hud-on.tv-fit .board{width:min(100vw,calc((100dvh - var(--party-band) - var(--party-band))*var(--ratio,1)));max-height:calc(100dvh - var(--party-band) - var(--party-band))}
body.tv-mode.party-hud-on.tv-fill .board{width:max(100vw,calc((100dvh - var(--party-band) - var(--party-band))*var(--ratio,1)));max-height:none}
@media(max-height:650px){body.tv-mode.party-hud-on{--party-band:85px}}
#tv-screen-report{display:none;position:fixed;right:14px;bottom:16px;z-index:33;max-width:min(460px,calc(100vw - 28px));padding:14px 18px;border:1px solid #b9ceaf;border-radius:12px;background:#0b231deb;color:#f5f4df;font:600 clamp(13px,1.2vw,18px)/1.55 system-ui;box-shadow:0 8px 24px #000a;white-space:pre-line;pointer-events:none}
body.tv-mode #tv-screen-report[data-visible="true"]{display:block}
.map-ambient{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.map-ambient .mote{position:absolute;width:var(--mote-size,9px);height:var(--mote-size,9px);border-radius:50%;left:var(--mote-x);top:var(--mote-y);background:radial-gradient(circle,#fffdea 0%,#e4d59999 30%,transparent 70%);filter:drop-shadow(0 0 5px #fff6c1b0);animation:map-mote-drift var(--mote-duration,7s) ease-in-out infinite alternate,map-mote-glow calc(var(--mote-duration,7s)*.65) ease-in-out infinite alternate;animation-delay:var(--mote-delay,0s)}
.map-ambient .glint{position:absolute;width:34px;height:34px;left:var(--mote-x);top:var(--mote-y);background:radial-gradient(circle,#fff9d6 0%,#fff7d7aa 12%,transparent 48%);animation:map-mote-glow var(--mote-duration,7s) ease-in-out infinite alternate;animation-delay:var(--mote-delay,0s)}
@keyframes map-mote-drift{from{transform:translate3d(-7px,5px,0)}to{transform:translate3d(10px,-13px,0)}}
@keyframes map-mote-glow{from{opacity:.16}to{opacity:.7}}
body.ambient-off .map-ambient{display:none}
/* Evergarden fullscreen-only frame: fixed to the display without resizing map or HUD. */

/* Evergarden storybook ornament — paint-only overlay, never affects layout or controls. */
:where(.tabletop-shell,body.tv-mode)::before,
:where(.tabletop-shell,body.tv-mode)::after{
 content:"";position:absolute;inset:4px;pointer-events:none;user-select:none;
 border-radius:10px;box-sizing:border-box;
}
:where(.tabletop-shell,body.tv-mode)::before{
 z-index:80;
 border:1px solid #bda66a85;
 box-shadow:inset 0 0 0 3px #1b39277a,inset 0 0 0 5px #b5a36b38,0 0 0 1px #0c221388;
 opacity:.78;
}
:where(.tabletop-shell,body.tv-mode)::after{
 z-index:81;
 /* Four hand-painted clusters of tiny leaves/petals, framed by thin golden twigs. */
 background:
  radial-gradient(ellipse 10px 5px at 17px 24px,#84a978d9 0 76%,transparent 80%) top left/64px 64px no-repeat,
  radial-gradient(ellipse 5px 11px at 29px 16px,#d2ba7bca 0 74%,transparent 80%) top left/64px 64px no-repeat,
  linear-gradient(135deg,transparent 42%,#baaa74a6 45% 47%,transparent 50%) top left/50px 50px no-repeat,
  radial-gradient(ellipse 10px 5px at calc(100% - 17px) 24px,#84a978d9 0 76%,transparent 80%) top right/64px 64px no-repeat,
  radial-gradient(ellipse 5px 11px at calc(100% - 29px) 16px,#d2ba7bca 0 74%,transparent 80%) top right/64px 64px no-repeat,
  linear-gradient(225deg,transparent 42%,#baaa74a6 45% 47%,transparent 50%) top right/50px 50px no-repeat,
  radial-gradient(ellipse 10px 5px at 17px calc(100% - 24px),#84a978d9 0 76%,transparent 80%) bottom left/64px 64px no-repeat,
  radial-gradient(ellipse 5px 11px at 29px calc(100% - 16px),#d2ba7bca 0 74%,transparent 80%) bottom left/64px 64px no-repeat,
  linear-gradient(45deg,transparent 42%,#baaa74a6 45% 47%,transparent 50%) bottom left/50px 50px no-repeat,
  radial-gradient(ellipse 10px 5px at calc(100% - 17px) calc(100% - 24px),#84a978d9 0 76%,transparent 80%) bottom right/64px 64px no-repeat,
  radial-gradient(ellipse 5px 11px at calc(100% - 29px) calc(100% - 16px),#d2ba7bca 0 74%,transparent 80%) bottom right/64px 64px no-repeat,
  linear-gradient(315deg,transparent 42%,#baaa74a6 45% 47%,transparent 50%) bottom right/50px 50px no-repeat;
 opacity:.6;
}
@media(max-height:600px){
 :where(.tabletop-shell,body.tv-mode)::after{opacity:.4}
}

body.tv-mode::before,body.tv-mode::after{position:fixed}
</style>
</head>
<body>
<header>
 <div class="brand">✿ The Shattered Hive <span style="font:400 13px system-ui">· Player Display</span></div>
 <div class="status" id="status" role="status" aria-live="polite" data-online="false">Connecting to DM tab…</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" id="tv-mode">📺 TV Mode</button><button type="button" id="fullscreen">⛶ Fullscreen</button></div>
</header>
<div id="tv-camera-controls" role="group" aria-label="Television map presentation"><button type="button" id="tv-fit" aria-pressed="false">Fit whole map</button><button type="button" id="tv-fill" aria-pressed="true">Fill TV</button><button type="button" id="tv-ambient" aria-pressed="true">✨ Effects On</button><button type="button" id="tv-party-toggle" aria-pressed="true" title="Show character cards in TV Mode">Party HUD On</button><button type="button" id="tv-screen-button" aria-pressed="false" aria-controls="tv-screen-report">Screen info</button></div><div id="tv-screen-report" role="status" aria-live="polite" data-visible="false"></div>
<div id="tv-hud" aria-hidden="true"><div id="tv-hud-scene"></div><div id="tv-hud-status" data-online="false">Connecting…</div></div><button type="button" id="tv-mode-exit" aria-label="Exit TV Mode" title="Exit TV Mode (Esc)">✕ Exit TV Mode</button>
<section id="party-top" class="party-hud" aria-label="Party status top row"></section><section id="party-bottom" class="party-hud" aria-label="Party status bottom row"></section><main id="stage"><div class="placeholder"><h1>🐛 Waiting for the Dungeon Master</h1><p>Keep the DM tab open on this computer. Shared maps, revealed terrain, and visible tokens will appear here automatically.</p></div></main>
<footer id="footer">Player-safe display · Read-only · Same-browser session</footer>
<script>
'use strict';
// Standalone display: never loads the campaign app, localStorage, Supabase, or DM data.
const status=document.getElementById('status'),stage=document.getElementById('stage'),footer=document.getElementById('footer');
const session=new URLSearchParams(location.hash.slice(1)).get('session')||'';
let channel=null,lastUpdate=0,lastSequence=0,tvMode=false,tvFill=true,tvAmbient=true,tvParty=true;
const tvHudScene=document.getElementById('tv-hud-scene'),tvHudStatus=document.getElementById('tv-hud-status');
function setStatus(label,online){status.textContent=label;status.dataset.online=online?'true':'false';tvHudStatus.textContent=label;tvHudStatus.dataset.online=online?'true':'false'}
function waiting(message){
 tvHudScene.textContent='';stage.replaceChildren();
 const wrap=document.createElement('div');wrap.className='placeholder';
 const heading=document.createElement('h1');heading.textContent='🐛 Waiting for the Dungeon Master';
 const text=document.createElement('p');text.textContent=message;
 wrap.append(heading,text);stage.append(wrap);
}
function safeAsset(path){
 if(typeof path==='string'&&path.startsWith('assets/maps/world-redesign/'))return /^[a-z0-9-]+[.]svg$/i.test(path.slice('assets/maps/world-redesign/'.length))?path:'';
 return typeof path==='string'&&/^assets\/(?:maps\/[a-z0-9_-]+\.(?:png|svg|webp)(?:\?v=[0-9]+)?|hero-tokens\/[a-z0-9_-]+_token\.png)$/i.test(path)?path:'';
}
function renderPartyHud(party){
 const top=document.getElementById('party-top'),bottom=document.getElementById('party-bottom');
 top.replaceChildren();bottom.replaceChildren();
 if(!Array.isArray(party)||party.length===0){
  const message=document.createElement('div');message.className='party-card party-empty';
  message.textContent='Party HUD: No matching heroes found. Check the DM character names and refresh both tabs.';
  top.append(message);return;
 }
 for(const [i,p] of party.slice(0,6).entries()){
  if(!p||typeof p.name!=='string')continue;
  const card=document.createElement('article');card.className='party-card';
  const info=document.createElement('div');info.className='party-card-info';
  const name=document.createElement('strong');name.textContent=p.name.slice(0,80);
  const meta=document.createElement('div');meta.className='party-meta';meta.textContent=String(p.className||'').slice(0,40);
  const stats=document.createElement('div');stats.className='party-stats';
  const num=n=>typeof n==='number'&&Number.isFinite(n)?String(n):'—';
  const stat=[ 'HP '+num(p.hp)+'/'+num(p.maxHp),'AC '+num(p.ac)];
  if(typeof p.tempHp==='number'&&p.tempHp>0)stat.push('Temp +'+num(p.tempHp));
  if(typeof p.initiative==='number')stat.push('Init '+(p.initiative>=0?'+':'')+num(p.initiative));
  for(const txt of stat){const el=document.createElement('span');el.textContent=txt;stats.append(el)}
  const effects=document.createElement('div');effects.className='party-effect';
  effects.textContent=(p.inspiration===true?'★ Inspiration · ':'')+(typeof p.conditions==='string'&&p.conditions.trim()?p.conditions.slice(0,160):'No active effects');
  info.append(name,meta,stats,effects);
  // Use only the app's preapproved miniature portrait asset directory.
  const main=document.createElement('div');main.className='party-card-main';
  const portrait=typeof p.portrait==='string'&&/^assets\/hero-tokens\/portraits\/[a-z0-9_-]+_miniature\.png$/i.test(p.portrait)?p.portrait:'';
  if(portrait){
   const img=document.createElement('img');img.className='party-portrait';img.src=portrait;
   img.alt=String(p.name).slice(0,80)+' character portrait';img.loading='eager';
   img.addEventListener('error',()=>img.remove());
   main.append(img);
  }
  main.append(info);card.append(main);
  if(Array.isArray(p.spellSlots)&&p.spellSlots.length){
   const slots=document.createElement('div');slots.className='party-slots';
   slots.setAttribute('aria-label','Remaining spell slots');
   for(const slot of p.spellSlots.slice(0,9)){
    if(!slot||!Number.isInteger(slot.level)||slot.level<1||slot.level>9||!Number.isInteger(slot.remaining)||slot.remaining<0)continue;
    const el=document.createElement('span');el.className='party-slot';
    el.textContent='Level '+slot.level+': '+slot.remaining+' left';slots.append(el);
   }
   if(slots.childElementCount)card.append(slots);
  }
  (i<3?top:bottom).append(card);
 }
}
function playerRender(packet){
 const scene=packet?.scene;
 if(!scene){document.getElementById('party-top').replaceChildren();document.getElementById('party-bottom').replaceChildren();waiting(packet?.notice||'The DM has not shared a map.');footer.textContent='Player-safe display · Waiting for a shared map';return}
 tvHudScene.textContent=String(scene.name||'Shared map').slice(0,100);renderPartyHud(packet?.party);
 const cols=Number(scene.cols),rows=Number(scene.rows);
 if(!Number.isInteger(cols)||!Number.isInteger(rows)||cols<4||cols>100||rows<4||rows>100)return;
 const reveal=new Set((Array.isArray(scene.revealed)?scene.revealed:[]).filter(x=>Number.isInteger(x)&&x>=0&&x<cols*rows));
 const visible=Array.isArray(scene.visibleNow)?new Set(scene.visibleNow.filter(x=>Number.isInteger(x)&&x>=0&&x<cols*rows)):reveal;
 const board=document.createElement('div');board.className='board';board.id='live-board';
 board.style.setProperty('--cols',String(cols));board.style.setProperty('--rows',String(rows));board.style.setProperty('--ratio',String(cols/rows));
 board.dataset.theme=String(scene.theme||'blank').slice(0,32);
 board.setAttribute('role','img');board.setAttribute('aria-label',String(scene.name||'Shared map')+' player-safe tabletop');
 const sizes={compact:['4%','36px'],standard:['5%','44px'],large:['6.5%','52px']};
 const selected=sizes[scene.tokenSize]||sizes.standard;
 board.style.setProperty('--hero-width',selected[0]);board.style.setProperty('--hero-max',selected[1]);
 const art=document.createElement('div');art.className='art';const prefix='assets/maps/expansions/';const sideArt=typeof scene.sideArt==='string'&&scene.sideArt.startsWith(prefix)&&/^[a-z0-9-]+[.]svg$/i.test(scene.sideArt.slice(prefix.length))?scene.sideArt:'';
 if(sideArt){const extra=document.createElement('img');extra.src=sideArt;extra.alt='';extra.draggable=false;extra.style.position='absolute';extra.style.inset='0';extra.style.width='100%';extra.style.height='100%';extra.style.objectFit='fill';art.append(extra)}
 const src=safeAsset(scene.image);
 if(src){const img=document.createElement('img');img.src=src;img.alt='';img.draggable=false;const c=scene.artCenter;if(c&&Number.isFinite(c.left)&&Number.isFinite(c.width)&&c.left>=0&&c.width>0&&c.left+c.width<=100.001){img.style.position='absolute';img.style.top='0';img.style.height='100%';img.style.left=c.left+'%';img.style.width=c.width+'%'}art.append(img)}
 // Keep the original player-safe illustration aligned inside the larger landscape.
 const core=scene.territory;
 if(core&&['left','top','width','height'].every(k=>typeof core[k]==='number'&&Number.isFinite(core[k]))&&core.left>=0&&core.top>=0&&core.width>0&&core.height>0&&core.left+core.width<=100.01&&core.top+core.height<=100.01){
  const inner=document.createElement('div');inner.className='territory-core';
  inner.style.position='absolute';inner.style.left=core.left+'%';inner.style.top=core.top+'%';inner.style.width=core.width+'%';inner.style.height=core.height+'%';
  while(art.firstChild)inner.append(art.firstChild);
  art.classList.add('territory-art');art.append(inner);
 }
 const ambience=document.createElement('div');ambience.className='map-ambient';ambience.setAttribute('aria-hidden','true');
 if(src&&src.startsWith('assets/maps/world-redesign/')){
  // Deterministic, public decorative lights; never read DM notes, character data or hidden markers.
  for(let i=0;i<24;i++){const el=document.createElement('span');el.className=i%5===0?'glint':'mote';const x=(17+i*37)%94+3,y=(21+i*29)%88+6;el.style.setProperty('--mote-x',x+'%');el.style.setProperty('--mote-y',y+'%');el.style.setProperty('--mote-size',(i%3+6)+'px');el.style.setProperty('--mote-duration',(5+i%6)+'s');el.style.setProperty('--mote-delay',(-i*.43)+'s');ambience.append(el)}
 }
 const grid=document.createElement('div');grid.className='grid';if(!scene.grid)grid.style.display='none';
 const tokens=document.createElement('div');tokens.className='tokens';
 for(const t of Array.isArray(scene.tokens)?scene.tokens:[]){
  if(!t||!Number.isInteger(t.x)||!Number.isInteger(t.y)||t.x<0||t.x>=cols||t.y<0||t.y>=rows)continue;
  if(!visible.has(t.y*cols+t.x))continue; // never show a creature only remembered from exploration
  const el=document.createElement('div');el.className='token'+(t.kind==='pc'?'':' other');
  el.style.left=((t.x+.5)/cols*100)+'%';el.style.top=((t.y+.5)/rows*100)+'%';
  if(/^#[0-9a-f]{6}$/i.test(t.bg||''))el.style.backgroundColor=t.bg;
  if(/^#[0-9a-f]{6}$/i.test(t.ring||''))el.style.borderColor=t.ring;
  const symbol=document.createElement('span');symbol.className='symbol';symbol.textContent=String(t.symbol||'●').slice(0,6);el.append(symbol);
  const tokenSrc=safeAsset(t.image);if(tokenSrc&&t.kind==='pc'){const img=document.createElement('img');img.src=tokenSrc;img.alt='';img.draggable=false;img.addEventListener('load',()=>{symbol.style.visibility='hidden'});img.addEventListener('error',()=>{img.remove()});el.append(img)}
  if(t.showLabel!==false){const name=document.createElement('span');name.className='label';name.textContent=String(t.name||'').slice(0,100);el.append(name)}
  tokens.append(el);
 }
 const fog=document.createElement('div');fog.className='fog';const cells=document.createDocumentFragment();
 for(let i=0;i<cols*rows;i++){const cell=document.createElement('div');if(visible.has(i))cell.className='revealed';else if(reveal.has(i))cell.className='explored';cells.append(cell)}
 fog.append(cells);art.append(ambience);board.append(art,grid,tokens,fog);
 stage.replaceChildren(board);
 footer.textContent=String(scene.name||'Shared map').slice(0,100)+' · '+cols+' × '+rows+' · Player-safe display';
}
function hello(){if(channel)channel.postMessage({type:'hello',session})}
if(!/^[a-f0-9-]{24,64}$/.test(session)||!('BroadcastChannel' in window)){
 setStatus('Live connection unavailable',false);
 waiting('Open this page using the Open Player Display button in your DM tab.');
}else{
 channel=new BroadcastChannel('sh-live-tabletop-v1-'+session);
 channel.onmessage=e=>{
  const msg=e.data;
  if(msg?.type!=='snapshot'||msg.session!==session||msg.snapshot?.version!==1)return;
  if(typeof msg.sentAt!=='number'||msg.sentAt<lastSequence)return;
  lastSequence=msg.sentAt;
  lastUpdate=Date.now();setStatus('Live · Connected to DM',true);playerRender(msg.snapshot);
 };
 hello();
 setInterval(()=>{
  hello();
  if(lastUpdate&&Date.now()-lastUpdate>9000)setStatus('Waiting for DM updates · Reconnecting…',false);
 },2000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)hello()});
}
function tvSetFraming(fill){tvFill=!!fill;document.body.classList.toggle('tv-fill',tvFill);document.body.classList.toggle('tv-fit',!tvFill);document.getElementById('tv-fill').setAttribute('aria-pressed',String(tvFill));document.getElementById('tv-fit').setAttribute('aria-pressed',String(!tvFill));}
function tvSetAmbient(enabled){tvAmbient=!!enabled;document.body.classList.toggle('ambient-off',!tvAmbient);const button=document.getElementById('tv-ambient');button.setAttribute('aria-pressed',String(tvAmbient));button.textContent=tvAmbient?'✨ Effects On':'✨ Effects Off';}
document.getElementById('tv-fill').addEventListener('click',()=>tvSetFraming(true));
document.getElementById('tv-fit').addEventListener('click',()=>tvSetFraming(false));
document.getElementById('tv-ambient').addEventListener('click',()=>tvSetAmbient(!tvAmbient));
document.getElementById('tv-party-toggle').addEventListener('click',()=>{
 tvParty=!tvParty;document.body.classList.toggle('party-hud-on',tvParty);
 const control=document.getElementById('tv-party-toggle');control.setAttribute('aria-pressed',String(tvParty));control.textContent=tvParty?'Party HUD On':'Party HUD Off';
});
// Local Screen 2 diagnostic only. No connection, campaign read, persistence or telemetry.
const screenReport=document.getElementById('tv-screen-report'),screenButton=document.getElementById('tv-screen-button');
function tvUpdateScreenReport(){
 const cssW=screen.width,cssH=screen.height,dpr=window.devicePixelRatio||1;
 const viewW=window.innerWidth,viewH=window.innerHeight;
 screenReport.textContent='Browser-reported screen: '+cssW+' × '+cssH+' CSS px\n'+
  'TV tab viewport: '+viewW+' × '+viewH+' CSS px\n'+
  'Pixel ratio: '+dpr.toFixed(2)+' (OS scaling may apply)\n'+
  'Estimated device pixels: '+Math.round(cssW*dpr)+' × '+Math.round(cssH*dpr)+'\n'+
  'Tip: Move this tab to Screen 2, enter TV Mode, and compare with Windows Display settings.';
}
screenButton.addEventListener('click',()=>{
 const visible=screenReport.dataset.visible!=='true';
 screenReport.dataset.visible=String(visible);screenButton.setAttribute('aria-pressed',String(visible));
 if(visible)tvUpdateScreenReport();
});
window.addEventListener('resize',()=>{if(screenReport.dataset.visible==='true')tvUpdateScreenReport()});
document.addEventListener('keydown',e=>{if(!tvMode)return;if(e.key==='f'||e.key==='F')tvSetFraming(!tvFill);if(e.key==='a'||e.key==='A')tvSetAmbient(!tvAmbient)});
function setTvMode(on){
 tvMode=!!on;document.body.classList.toggle('tv-mode',tvMode);document.body.classList.toggle('party-hud-on',tvParty);tvSetFraming(tvFill);tvSetAmbient(tvAmbient);if(screenReport.dataset.visible==='true')tvUpdateScreenReport();
 document.getElementById('tv-mode').setAttribute('aria-pressed',String(tvMode));
 document.getElementById('tv-hud').setAttribute('aria-hidden',String(!tvMode));
 if(tvMode){
  // Guard against an exit click while the asynchronous fullscreen request is pending.
  document.documentElement.requestFullscreen?.().then(()=>{
   if(!tvMode&&document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
  }).catch(()=>{});
 }else if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{});}
}
document.getElementById('tv-mode').addEventListener('click',()=>setTvMode(!tvMode));
document.getElementById('tv-mode-exit').addEventListener('click',()=>setTvMode(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tvMode)setTvMode(false)});
document.addEventListener('fullscreenchange',()=>{if(tvMode&&!document.fullscreenElement)setTvMode(false)});
// Fullscreen and TV Mode must expose the same read-only character HUD.
// Previously standalone Fullscreen omitted TV Mode CSS and hid the roster.
document.getElementById('fullscreen').addEventListener('click',()=>{
 if(tvMode||document.fullscreenElement)setTvMode(false);
 else setTvMode(true);
});
</script>
